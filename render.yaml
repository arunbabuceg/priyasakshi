services:
  - type: web
    name: priya-sakshi-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: priya_sakshi
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_ENABLED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: BRAND_FROM_EMAIL
        value: "hello@priyasakshi.com"
      - key: BRAND_NAME
        value: "Priya Sakshi"
