services:
  - type: web
    name: lakshmi-sakshi-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: lakshmi_sakshi
      - key: STRIPE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
